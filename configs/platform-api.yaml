service:
  name: "platform-api"
  http_addr: ":8080"
  log_level: "debug"
  log_file: "/var/log/aipc/platform-api.log"
  # HTTPS (TLS) listener. The web console is served over HTTPS; the plain-HTTP
  # :8080 listener is kept as a 301 -> HTTPS redirect so old bookmarks migrate.
  # With cert_file/key_file both empty, the device generates a self-signed
  # ECDSA P-256 certificate once into auto_cert_dir (SANs = all NIC IPv4 +
  # localhost). Set both to use an operator-owned cert/key pair instead.
  tls:
    enabled: true
    https_addr: ":443"
    cert_file: ""                         # empty = device auto-generates self-signed
    key_file: ""                          # empty = device auto-generates self-signed
    auto_cert_dir: "/data/aipc/etc/ssl"
    redirect_http: true                   # http://<ip>:8080 -> https://<ip>

services:
  ai_runtime: "unix:///run/aipc/ai-runtime.sock"
  event_bus: "unix:///run/aipc/event-bus.sock"
  device_control: "unix:///run/aipc/device-control.sock"
  app_manager: "unix:///run/aipc/app-manager.sock"
  camera_control: "unix:///run/aipc/camera-control.sock"

model:
  storage_path: "/data/aipc/models"

storage:
  root_path: "/data/aipc"
  model_blob_path: "/data/aipc/models/blobs"
  min_free_bytes: 104857600  # 100MB minimum free space

stream:
  camera_config: "/data/aipc/etc/camera-daemon.yaml"
  rtsp_base_url: "rtsp://localhost:8554"
  encoded_pub_dir: "/run/aipc/encoded"

web:
  static_path: "/data/aipc/web"
  enable_cors: true

auth:
  enabled: true
  # Auth secrets ship empty so the public repo carries no baked-in credentials.
  # Override at deploy time with env vars (checked by platform-api at startup):
  #   AIPC_TOKEN_KEY       – JWT/Bearer signing secret (random per boot if unset)
  #   AIPC_AUTH_USERNAME   – login username
  #   AIPC_AUTH_PASSWORD   – login password
  # Leave empty only on a trusted first-boot device; a missing token_key is
  # auto-generated and logged once, then rotated via env for persistence.
  token_key: ""
  username: "admin"
  password: ""

database:
  path: "/data/aipc/data/platform.db"

# Gyro / attitude SSE source (LSM6DSR IMU via Linux IIO sysfs).
# Drives GET /api/v1/monitor/gyro/attitude. Disable on hosts without the IMU;
# a missing sensor degrades gracefully (status=offline, no crash).
gyro:
  enabled: true
  poll_rate_hz: 12         # matches LSM6DSR ODR (~12.5 Hz); avoids re-reading stale sysfs
  fusion_alpha: 0.05       # complementary filter coefficient in (0,1); smaller = smoother/slower
  iio_base: "/sys/bus/iio/devices"
  # Optional device-dir overrides (auto-discovered when blank):
  # accel_path: "/sys/bus/iio/devices/iio:device1"
  # gyro_path: "/sys/bus/iio/devices/iio:device0"
  # Row-major 3x3 body -> world mount matrix (X forward, Y right, Z up).
  # Calibrate per PCB orientation; the identity below assumes the sensor axes
  # already match the spec frame.
  mount_matrix: [1, 0, 0,  0, 1, 0,  0, 0, 1]
  # One-shot startup static gyro-bias calibration: averages the first window of
  # gyro samples (assumes the device is still at boot) and subtracts the mean
  # from every subsequent sample. Kills the ~15 deg/min yaw self-rotation caused
  # by integrating the sensor's zero-rate offset. Disable if the device is
  # guaranteed to be moving at boot (would corrupt the estimate instead).
  calibrate_bias: true
  calibration_ms: 2000   # averaging window; N = calibration_ms/1000 * poll_rate_hz (clamped 12..200)
