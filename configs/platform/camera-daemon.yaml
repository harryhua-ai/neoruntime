# camera-daemon configuration (Hailo-15)
# Usage: camera-daemon -c /data/aipc/etc/camera-daemon.yaml
#
# Note: The 'streams' section has been removed — it was redundant with 'encoders'.
# In FROM_MEDIA mode, video contexts are auto-discovered from the pipeline.
# In standalone mode, camera-daemon derives stream configs from 'encoders'.

hal:
  video_library: /data/aipc/lib/hal/libaipc_hal.so
  codec_library: /data/aipc/lib/hal/libaipc_hal.so
  lens_library: /data/aipc/lib/hal/libhal-lens-bridge.so
  # led_library: optional, monolithic libaipc_hal.so includes HAL_LED_OPS
  # overlay_library: same libaipc_hal.so (monolithic, auto-detected)

# Media pipeline configuration (Hailo15 v2: required for FROM_MEDIA mode)
media:
  config_path: /etc/imaging/cfg/medialib_configs/ai_example_medialib_config.json
  backup_path: /data/aipc/data/media-backup

video:
  device_path: /dev/video0

watchdog:
  scan_interval_ms: 100
  frame_timeout_ms: 5000
  warn_threshold_ms: 3000

rtsp:
  enabled: true

audio:
  enabled: true
  capture_device: "default"
  sample_rate: 48000
  channels: 1
  codec: pcm
  bitrate: 128000
  volume: 1.0
  mute: false
  # audio_library: optional, monolithic libaipc_hal.so includes HAL_AUDIO_OPS

ai_overlay:
  enabled: true
  event_bus_endpoint: "unix:///run/aipc/event-bus.sock"
  topic_prefix: "inference/"
  draw_labels: true
  draw_confidence: true
  draw_landmarks: true
  enable_face_blur: false
  box_thickness: 2
  # Stream mapping: inference_stream_id → display_encoder_stream
  stream_map: "third:main,sub:main"

# Encoders is the single source of truth for all stream configurations.
# 'enabled' controls whether the stream is active in the pipeline (persisted across restarts).
# main stream cannot be disabled.
# Use POST /api/v1/media/streams/:name/enable and DELETE /api/v1/media/streams/:name/disable
# to enable/disable sub and third streams at runtime (triggers ReconfigurePipeline).
encoders:
  - stream_name: main
    codec: h264
    width: 1920
    height: 1080
    fps: 30
    bitrate: 4000000
    gop: 30
    enabled: true
  - stream_name: sub
    codec: h264
    width: 1280
    height: 720
    fps: 30
    bitrate: 2000000
    gop: 60
    enabled: true
  - stream_name: third
    codec: h264
    width: 640
    height: 384
    fps: 15
    bitrate: 512000
    gop: 30
    enabled: true

service:
  log_level: debug
  log_file: /var/log/aipc/camera-daemon.log
